<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <style>
        body { margin: 0; padding: 0; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: #ffffff; min-width: 250px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1; top: 100%; left: 0; }
        .dropdown-content a { color: #000000 !important; padding: 12px 16px; text-decoration: none; display: block; font-size: 30px; font-family: 'Courier New', Courier, monospace; }
        .dropdown-content a:hover { background-color: #f1f1f1; }
        .dropdown:hover .dropdown-content { display: block; }
    </style>
</head>
<body>

    <!-- Pasek nawigacji -->
    <div class="container" style="display: flex; align-items: center; gap: 15px; margin: 10px;">
        <img src="/Chora-psychiatrycznie-Pi-dziesi-clocent-wka-site/logo.jpeg" alt="Logo" style="width: 200px; height: 200px; object-fit: cover; border-radius: 50%;">
        <div style="display: flex; gap: 30px; margin-left: auto; align-items: center;">
            <a href="/Chora-psychiatrycznie-Pi-dziesi-clocent-wka-site/index.html" style="font-size: 50px; font-family: 'Courier New', Courier, monospace; text-decoration: none; color: #000000;">GŁÓWNA</a>
            <div class="dropdown">
                <a href="#" style="font-size: 50px; font-family: 'Courier New', Courier, monospace; text-decoration: none; color: #000000;">BLOG</a>
                <div class="dropdown-content">
                    <a href="/Chora-psychiatrycznie-Pi-dziesi-clocent-wka-site/traneg.html">Traneg</a>
                    <a href="/Chora-psychiatrycznie-Pi-dziesi-clocent-wka-site/wieslawpiecigrod.html">Wiesław Pięcigród</a>
                    <a href="/Chora-psychiatrycznie-Pi-dziesi-clocent-wka-site/opcja3.html">Opcja 3</a>
                </div>
            </div>
            <a href="/Chora-psychiatrycznie-Pi-dziesi-clocent-wka-site/przyciski.html" style="font-size: 50px; font-family: 'Courier New', Courier, monospace; text-decoration: none; color: #000000;">PRZYCISKI</a>
            <a href="/Chora-psychiatrycznie-Pi-dziesi-clocent-wka-site/DRIVE" style="font-size: 50px; font-family: 'Courier New', Courier, monospace; text-decoration: none; color: #000000;">ZDJĘCIA</a>
            <a href="/Chora-psychiatrycznie-Pi-dziesi-clocent-wka-site/login.html" style="font-size: 50px; font-family: 'Courier New', Courier, monospace; text-decoration: none; color: #000000;">LOGIN</a>
        </div>
    </div>

    <!-- Tresc Artykulu -->
    <div style="max-width: 1000px; margin: 50px auto; padding: 20px; font-family: 'Courier New', Courier, monospace; min-height: 60vh;">
        <h1 style="font-size: 60px; font-weight: bold; margin-bottom: 10px;">{{ page.title }}</h1>
        <p style="font-size: 24px; color: #928f84;">Data publikacji: {{ page.date | date: "%Y-%m-%d" }} | Autor: {{ page.author }}</p>
        <hr style="border: 1px solid #7c7c7c; margin-bottom: 40px;">
        
        <div style="font-size: 30px; line-height: 1.6; color: #000000;">
            {{ content }}
        </div>
    </div>

    <!-- Stopka -->
    <div class="container" style="background-color: #7c7c7c; width: 100%;">
        <p style="font-size: 50px; text-align: center; font-family: 'Comic Neue'; margin: 0; padding: 20px 0;">
            Trade mark. All rights reserved. Chora psychiatrycznie Pięćdziesięciocentówka
        </p>
    </div>

</body>
</html>
